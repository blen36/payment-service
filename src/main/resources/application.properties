spring.application.name=payment-service
spring.config.import=optional:file:./.env[.properties]
spring.profiles.default=local
server.port=${PAYMENT_PORT:8084}

spring.mongodb.uri=${PAYMENT_MONGODB_URI:mongodb://localhost:27017/payment_service_db?serverSelectionTimeoutMS=5000}
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.representation.big-decimal=decimal128
payment.migrations.enabled=true
payment.migrations.change-log=db/changelog/db.changelog-master.xml

payment.order-service-url=${ORDER_SERVICE_URL:http://localhost:8083}
payment.random-api-url=${RANDOM_API_URL:https://www.random.org}
payment.http.connect-timeout=3s
payment.http.read-timeout=8s

payment.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8082/.well-known/jwks.json}
payment.jwt.issuer=${AUTH_JWT_ISSUER:authentication-service}
payment.jwt.audience=${AUTH_JWT_AUDIENCE:java-advanced-api}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# CREATE_PAYMENT events are retried from the embedded MongoDB outbox.
payment.events.enabled=${PAYMENT_EVENTS_ENABLED:true}
payment.events.scheduling-enabled=${PAYMENT_EVENTS_SCHEDULING_ENABLED:true}
payment.events.topic=${PAYMENT_EVENTS_TOPIC:payment-events}
payment.events.poll-delay-ms=2000
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
