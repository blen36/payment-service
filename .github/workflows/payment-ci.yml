name: Payment Service CI

on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: bash ./mvnw -B -ntp clean test-compile
      - name: Unit and integration tests (MongoDB, Kafka, WireMock)
        run: bash ./mvnw -B -ntp verify
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Build Docker image
        run: docker build --tag "payment-service:${{ github.sha }}" .
      - name: Export Docker image
        shell: bash
        run: docker save "payment-service:${{ github.sha }}" | gzip -1 > payment-service-image.tar.gz
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-image-${{ github.sha }}
          path: payment-service-image.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
