name: java-advanced-payment
services:
  payment-mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PAYMENT_MONGO_USER:?Set PAYMENT_MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${PAYMENT_MONGO_PASSWORD:?Set PAYMENT_MONGO_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${PAYMENT_MONGO_DB:?Set PAYMENT_MONGO_DB in .env}
    ports:
      - "127.0.0.1:${PAYMENT_MONGO_PORT:-27017}:27017"
    volumes:
      - payment-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
volumes:
  payment-mongo-data:
