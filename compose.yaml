name: java-advanced-payment
services:
  payment-mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PAYMENT_MONGO_USER:?Set PAYMENT_MONGO_USER in
        .env}
      MONGO_INITDB_ROOT_PASSWORD: ${PAYMENT_MONGO_PASSWORD:?Set PAYMENT_MONGO_PASSWORD
        in .env}
      MONGO_INITDB_DATABASE: ${PAYMENT_MONGO_DB:?Set PAYMENT_MONGO_DB in .env}
    ports:
    - 127.0.0.1:${PAYMENT_MONGO_PORT:-27017}:27017
    volumes:
    - payment-mongo-data:/data/db
    healthcheck:
      test:
      - CMD-SHELL
      - 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD"
        --authenticationDatabase admin --eval ''quit(db.adminCommand({ping:1}).ok
        ? 0 : 1)'''
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
  kafka:
    image: apache/kafka:4.0.0
    ports:
    - 127.0.0.1:${KAFKA_PORT:-9092}:9092
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092
        >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
  payment-service:
    image: payment-service:${PAYMENT_IMAGE_TAG:-local}
    build:
      context: .
    ports:
    - 127.0.0.1:${PAYMENT_PORT:-8084}:8084
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PAYMENT_PORT: '8084'
      PAYMENT_MONGODB_URI: ${PAYMENT_MONGODB_URI_DOCKER:?Run tools/prepare-env.ps1
        first}
      ORDER_SERVICE_URL: ${PAYMENT_CONTAINER_ORDER_URL:-http://host.docker.internal:8083}
      AUTH_JWKS_URI: ${PAYMENT_CONTAINER_JWKS_URI:-http://host.docker.internal:8082/.well-known/jwks.json}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_EVENTS_TOPIC: ${PAYMENT_EVENTS_TOPIC:-payment-events}
      RANDOM_API_URL: ${RANDOM_API_URL:-https://www.random.org}
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      payment-mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --max-time
      - '3'
      - http://localhost:8084/actuator/health
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
volumes:
  payment-mongo-data: null
  kafka-data: null
